# Deploy to Cloudflare Pages via Direct Upload.
#
# This workflow is for sites provisioned by the kantan panel, which creates a
# Cloudflare Pages project WITHOUT a Git connection and writes three repository
# secrets (CF_API_TOKEN, CF_ACCOUNT_ID, CF_PAGES_PROJECT). Every push to main —
# including content edits made in the editor — rebuilds and deploys
# the site.
#
# CF_PAGES_PROJECT is the panel-specific marker: only sites provisioned by the
# kantan panel carry it. When it is absent (e.g. this template's own repo), the
# workflow skips itself cleanly rather than failing on missing credentials.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
      # Optional: the site canonical URL (used by RSS/sitemap) for sites whose
      # src/config.json does not yet carry site.url — the panel seeds this repo
      # variable at provisioning and rewrites it when a custom domain attaches.
      # Precedence: src/config.json site.url > this variable (astro.config.mjs).
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Check for panel-provisioned credentials
        id: gate
        run: |
          if [ -z "$CF_PAGES_PROJECT" ]; then
            echo "No CF_PAGES_PROJECT secret — skipping direct-upload deploy."
            echo "(Classic Git-connected Pages projects are built by Cloudflare automatically.)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # The panel provisions the Pages project under this exact name. Pass
          # --branch explicitly: actions/checkout leaves a detached HEAD, so
          # wrangler's git-branch detection fails and the direct-upload deploy
          # lands as a PREVIEW instead of production (the apex never updates).
          # --branch=main matches the project's production_branch, so every
          # deploy promotes to production.
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT }} --branch=main
