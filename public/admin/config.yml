# https://sveltiacms.app/en/docs/config-basics
# (Sveltia CMS — the Svelte successor to Netlify/Decap CMS. It reads the same
# config.yml schema, so this file is compatible with both.)
#
# The kantan panel injects `repo`, `base_url`, and `auth_endpoint` into this file
# at provisioning, so the OAuth flow works on any site or custom domain without
# further edits. This file is a template — point `repo` at your own repository
# before editing manually.
#
# kantan sites are single-language: content lives flat (no per-locale folders)
# and the editor has no i18n tabs. The editor's UI language follows the site's
# chosen language — the panel seeds it via public/admin/lang.js at provisioning.

backend:
  name: github
  # IMPORTANT: update to your own GitHub fork, e.g. your-username/template
  repo: kantan-hp/template
  branch: main

media_folder: public/images
public_folder: /images

# Sveltia writes empty optional fields (e.g. description/updatedDate/heroImage)
# unless told otherwise; omitting them keeps the Astro content schema happy.
output:
  omit_empty_optional_fields: true

collections:
  # ---- Blog posts -----------------------------------------------------------
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: blog/{{slug}}
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Updated Date, name: updatedDate, widget: datetime, required: false }
      - { label: Hero Image, name: heroImage, widget: image, choose_url: true, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  # ---- Standalone pages (About, etc.) --------------------------------------
  - name: pages
    label: Pages
    files:
      - name: about
        label: About
        file: src/content/pages/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text, required: false }
          - { label: Body, name: body, widget: markdown }

  # ---- Site settings (src/config.json) -------------------------------------
  # The "lightweight WordPress" panel: edits below land on the live site on the
  # next deploy, no code touched.
  #
  # NOTE: src/config.json is a plain JSON object. `site` and `theme` are object
  # widgets so their edits bind to the real nested keys (the CMS treats a flat
  # field name as a literal key, so `site.title` would not nest).
  #
  # Settings are intentionally not localized — the site title, tagline, theme,
  # nav and socials are global (kantan sites are single-language).
  - name: settings
    label: Settings
    files:
      - name: settings
        label: Site settings
        file: src/config.json
        format: json
        fields:
          - label: Site
            name: site
            widget: object
            fields:
              - { label: Site title, name: title, widget: string }
              - { label: Tagline, name: description, widget: text }
              - { label: Author, name: author, widget: string, required: false }
              - label: Language
                name: lang
                widget: select
                options:
                  - { label: English, value: en }
                  - { label: 日本語, value: ja }
                  - { label: 繁體中文, value: zh-Hant }
                  - { label: 简体中文, value: zh-Hans }
          - label: Theme
            name: theme
            widget: object
            fields:
              - label: Theme preset
                name: preset
                widget: select
                options:
                  - { label: Paper (default), value: paper }
                  - { label: Kha-Yan, value: kha-yan }
                  - { label: Nila, value: nila }
                  - { label: Jadeite, value: jadeite }
                  - { label: Pyit Tine Htaung, value: pyit-tine-htaung }
                  - { label: Deep Purple, value: deep-purple }
                  - { label: Ember, value: ember }
                  - { label: Espresso, value: espresso }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Social links
            name: socials
            widget: list
            required: false
            fields:
              - { label: Name, name: name, widget: string }
              - { label: URL, name: url, widget: string }
