<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS (the Svelte successor to Netlify/Decap CMS) reads
         public/admin/config.yml on its own. The kantan panel injects the site's
         `repo` and the shared auth proxy (`base_url` / `auth_endpoint`) into that
         file at provisioning, so the editor needs no runtime config. Version
         pinned because Sveltia is pre-1.0. -->
    <!-- Seeds the editor UI language from the site's chosen language (the
         panel rewrites the value inside lang.js at provisioning). -->
    <script src="/admin/lang.js?v=2"></script>
    <script
      src="https://unpkg.com/@sveltia/cms@0.178.0/dist/sveltia-cms.js"
      integrity="sha384-JaupnMgbYkiRRASh2WV1+EcLmDDy/gkT2nuBq4R1RpKgSw7coIAY+HNHVUsLTYVw"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
